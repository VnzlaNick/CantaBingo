<script>
      function toggleDaub(el) {
        const isDaubed = el.classList.contains('bg-primary');
        if (isDaubed) {
          el.classList.remove('bg-primary', 'text-on-primary', 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)]');
          el.classList.add('bg-surface-container', 'text-on-surface');
        } else {
          el.classList.remove('bg-surface-container', 'text-on-surface');
          el.classList.add('bg-primary', 'text-on-primary', 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)]');
          
          // Pop animation
          el.animate([
            { transform: 'scale(1)' },
            { transform: 'scale(1.15)' },
            { transform: 'scale(1)' }
          ], {
            duration: 200,
            easing: 'ease-out'
          });
        }
      }

      // Mock ball caller animation
      const currentBallDisplay = document.getElementById('ball-animation-target');
      const ballTexts = ["B-12", "I-24", "N-33", "G-42", "O-61"];
      let ballIndex = 0;

      setInterval(() => {
        // Trigger exit/re-entry pop effect
        currentBallDisplay.classList.remove('animate-pop-in');
        void currentBallDisplay.offsetWidth; // Trigger reflow
        currentBallDisplay.classList.add('animate-pop-in');
        
        ballIndex = (ballIndex + 1) % ballTexts.length;
        currentBallDisplay.querySelector('span').innerText = ballTexts[ballIndex];
      }, 5000);

      // Win button excitement
      const bingoBtn = document.getElementById('bingo-btn');
      bingoBtn.addEventListener('click', () => {
        document.body.animate([
          { transform: 'translateX(0)' },
          { transform: 'translateX(-5px)' },
          { transform: 'translateX(5px)' },
          { transform: 'translateX(0)' }
        ], { duration: 100, iterations: 3 });
        
        bingoBtn.classList.add('ring-4', 'ring-secondary-container/50');
        setTimeout(() => bingoBtn.classList.remove('ring-4', 'ring-secondary-container/50'), 1000);
      });
    </script>
